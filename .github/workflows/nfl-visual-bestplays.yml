name: Polish NFL model highlights and Best Plays integration
on:
  push:
    paths:
      - '.github/workflows/nfl-visual-bestplays.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch NFL UI and Best Plays
        run: |
          python - <<'PY'
          from pathlib import Path

          nfl=Path('client/src/pages/NFL.tsx')
          s=nfl.read_text()
          s=s.replace('opacity-[0.25] blur-[2px] saturate-[0.8]', 'opacity-[0.42] blur-[1px] saturate-[1.05] contrast-[1.05]')
          s=s.replace('from-background/55 via-background/76 to-background/95', 'from-background/38 via-background/62 to-background/88')
          s=s.replace('from-background/50 via-transparent to-background/45', 'from-background/32 via-transparent to-background/28')
          old="<Badge className={qualified?'border-emerald-500/30 bg-emerald-500/15 text-emerald-500':'border-amber-500/30 bg-amber-500/15 text-amber-500'}>{qualified?'OFFICIAL PLAY':'MODEL LEAN'}</Badge>"
          new="<Badge className={qualified?'nfl-official-live border-emerald-400/50 text-emerald-50':'nfl-model-lean-live border-orange-300/60 text-orange-50'}>{qualified?'OFFICIAL PLAY':'MODEL LEAN'}</Badge>"
          if old not in s: raise SystemExit('NFL badge target not found')
          s=s.replace(old,new)
          nfl.write_text(s)

          css=Path('client/src/index.css')
          c=css.read_text()
          block='''\n/* NFL live model signals: moving light without flashing. */\n.nfl-model-lean-live {\n  background: linear-gradient(110deg, rgba(194,65,12,.88), rgba(249,115,22,.96), rgba(251,191,36,.88), rgba(234,88,12,.96));\n  background-size: 280% 100%;\n  animation: nfl-live-orange 3.2s ease-in-out infinite;\n  box-shadow: 0 0 12px rgba(249,115,22,.28), 0 0 24px rgba(249,115,22,.14);\n}\n.nfl-official-live {\n  background: linear-gradient(110deg, rgba(4,120,87,.92), rgba(16,185,129,.96), rgba(52,211,153,.88), rgba(5,150,105,.96));\n  background-size: 280% 100%;\n  animation: nfl-live-green 2.8s ease-in-out infinite;\n  box-shadow: 0 0 14px rgba(16,185,129,.30), 0 0 28px rgba(16,185,129,.15);\n}\n@keyframes nfl-live-orange { 0%,100% { background-position: 0% 50%; box-shadow: 0 0 10px rgba(249,115,22,.24),0 0 20px rgba(249,115,22,.10); } 50% { background-position: 100% 50%; box-shadow: 0 0 17px rgba(251,146,60,.42),0 0 34px rgba(249,115,22,.20); } }\n@keyframes nfl-live-green { 0%,100% { background-position: 0% 50%; box-shadow: 0 0 11px rgba(16,185,129,.24),0 0 22px rgba(16,185,129,.10); } 50% { background-position: 100% 50%; box-shadow: 0 0 18px rgba(52,211,153,.40),0 0 36px rgba(16,185,129,.18); } }\n@media (prefers-reduced-motion: reduce) { .nfl-model-lean-live,.nfl-official-live { animation: none; } }\n'''
          if 'nfl-model-lean-live' not in c: css.write_text(c+block)

          bp=Path('client/src/pages/BestPlays.tsx')
          b=bp.read_text()
          type_anchor="type NflSlate={games:NflGame[]};"
          type_add="type NflSlate={games:NflGame[]};\ntype NflTdPick={player:string;team?:string;headshot?:string;bestOdds:number;bestBook:string;modelProbability?:number;edgePoints?:number;expectedValue?:number;qualifies?:boolean};type NflTdGame={id:string;date:string;away:{abbreviation:string;name:string;logo:string|null};home:{abbreviation:string;name:string;logo:string|null};anytimeTd:NflTdPick[];firstTd:NflTdPick[]};type NflMarkets={games:NflTdGame[]};"
          if type_anchor not in b: raise SystemExit('BestPlays NFL type anchor not found')
          b=b.replace(type_anchor,type_add)
          query_anchor="const nfl=useQuery<NflSlate>({queryKey:['/api/nfl/slate'],staleTime:60000,refetchInterval:120000,retry:1});"
          query_add=query_anchor+"\n  const nflMarkets=useQuery<NflMarkets>({queryKey:['/api/nfl/markets'],staleTime:120000,refetchInterval:300000,retry:1});"
          if query_anchor not in b: raise SystemExit('BestPlays NFL query anchor not found')
          b=b.replace(query_anchor,query_add)
          loop_anchor="for(const g of nfl.data?.games||[]){const sides=[g.away,g.home].filter(x=>x.winProbability!==null).sort((a,b)=>(b.winProbability||0)-(a.winProbability||0)),top=sides[0];if(top&&top.winProbability!==null&&top.winProbability>=55)out.push({id:`nfl-ml-${g.id}`,sport:'NFL',market:'Moneyline',matchup:`${g.away.abbr} @ ${g.home.abbr}`,pick:`${top.abbr} ML`,probability:top.winProbability,time:g.date,tier:tier(top.winProbability),note:'Team win model',href:'/nfl'})}"
          td_loop=loop_anchor+"\n    for(const g of nflMarkets.data?.games||[]){for(const [market,rows] of [['First TD',g.firstTd],['Anytime TD',g.anytimeTd]] as const){for(const p of rows.filter(x=>x.qualifies).slice(0,2)){if(p.modelProbability==null)continue;const edge=p.edgePoints??0,ev=p.expectedValue??0;out.push({id:`nfl-td-${market}-${g.id}-${p.player}`,sport:'NFL',market,matchup:`${g.away.abbreviation} @ ${g.home.abbreviation}`,pick:p.player,probability:p.modelProbability,time:g.date,tier:edge>=5&&ev>=.14?'BEST PLAY':'STRONG PLAY',note:`OFFICIAL PLAY · ${p.bestOdds>0?'+':''}${Math.round(p.bestOdds)} ${p.bestBook} · ${edge>=0?'+':''}${edge.toFixed(1)} pt edge · ${ev>=0?'+':''}${(ev*100).toFixed(0)}% EV`,href:'/nfl',headshot:p.headshot??null,awayLogo:g.away.logo,homeLogo:g.home.logo,awayAbbr:g.away.abbreviation,homeAbbr:g.home.abbreviation})}}}"
          if loop_anchor not in b: raise SystemExit('BestPlays NFL loop anchor not found')
          b=b.replace(loop_anchor,td_loop)
          dep_old='[mlb.data,mlbHr.data,nbaStats.data,nbaGames.data,wnba.data,wnbaProps.data,nfl.data]'
          dep_new='[mlb.data,mlbHr.data,nbaStats.data,nbaGames.data,wnba.data,wnbaProps.data,nfl.data,nflMarkets.data]'
          if dep_old not in b: raise SystemExit('BestPlays dependency anchor not found')
          b=b.replace(dep_old,dep_new)
          bp.write_text(b)
          PY
      - name: Commit changes
        run: |
          git config user.name 'prezitools-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/nfl-visual-bestplays.yml
          git add client/src/pages/NFL.tsx client/src/pages/BestPlays.tsx client/src/index.css
          git commit -m 'Animate NFL model signals and surface official TD plays'
          git push
