name: Fix nflverse player stats path
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-nflverse-player-stats.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch nflverse player stats URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server/nflModels.ts')
          s=p.read_text()
          old="${NFLVERSE}/player_stats/player_stats.csv.gz"
          new="${NFLVERSE}/stats_player/stats_player_reg_${season}.csv.gz"
          if old not in s:
              raise SystemExit('Expected old nflverse player stats URL not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/fix-nflverse-player-stats.yml
          git config user.name 'prezitools-model-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add server/nflModels.ts .github/workflows/fix-nflverse-player-stats.yml
          git commit -m 'Correct nflverse player stats release path'
          git push
