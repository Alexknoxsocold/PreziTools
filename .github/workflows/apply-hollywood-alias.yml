name: Apply Hollywood Brown Alias
on:
  push:
    branches: [nfl-baseline-resolution-diagnostics]
    paths: ['.github/workflows/apply-hollywood-alias.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nfl-baseline-resolution-diagnostics
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed alias only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server/nflModels.ts')
          s=p.read_text()
          old="function playerKey(v:string){const raw=v.trim(),spaced=raw.replace(/\\s+(?:jr\\.?|sr\\.?|ii|iii|iv|v)\\s*$/i,'');if(spaced!==raw)return norm(spaced);const normalized=norm(raw);return normalized.replace(/(?:jr|sr|iii|ii|iv|v)$/,'')}function uniquePlayerMatch<T>(map:Map<string,T>,name:string){const exact=map.get(norm(name));"
          new="function canonicalPlayerName(v:string){return norm(v)==='hollywoodbrown'?'Marquise Brown':v}function playerKey(v:string){const raw=v.trim(),spaced=raw.replace(/\\s+(?:jr\\.?|sr\\.?|ii|iii|iv|v)\\s*$/i,'');if(spaced!==raw)return norm(spaced);const normalized=norm(raw);return normalized.replace(/(?:jr|sr|iii|ii|iv|v)$/,'')}function uniquePlayerMatch<T>(map:Map<string,T>,name:string){name=canonicalPlayerName(name);const exact=map.get(norm(name));"
          if old not in s: raise SystemExit('identity helper anchor not found')
          s=s.replace(old,new,1)
          old2="async function playerBaseline(name:string,teams:string[]):Promise<PlayerBaseline|null>{for(const team of teams){const players=await roster(team),target=norm(name),safeTarget=playerKey(name),"
          new2="async function playerBaseline(name:string,teams:string[]):Promise<PlayerBaseline|null>{name=canonicalPlayerName(name);for(const team of teams){const players=await roster(team),target=norm(name),safeTarget=playerKey(name),"
          if old2 not in s: raise SystemExit('baseline anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Commit validated alias
        run: |
          git config user.name 'PreziTools Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add server/nflModels.ts
          git commit -m 'Resolve Hollywood Brown to Marquise Brown baseline'
          git push origin HEAD:nfl-baseline-resolution-diagnostics
