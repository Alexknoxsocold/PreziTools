name: Float category tabs all screens
on:
  push:
    paths:
      - '.github/workflows/float-category-tabs-all.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply universal floating category tabs
        shell: bash
        run: |
          cat >> client/src/mobile-category-tabs.css <<'EOF'

/* Universal floating secondary category navigation.
   Only the individual category controls remain visible; no blue rail/container. */
.sticky.top-0.z-20.border-b[class~="bg-card/95"].backdrop-blur,
nav[aria-label="NBA sections"],
.mlb-page nav[aria-label="MLB sections"],
.border-b.bg-card:has(> .mx-auto.flex.max-w-7xl.items-center.justify-between.gap-2.px-4) {
  background: transparent !important;
  border: 0 !important;
  border-top: 0 !important;
  border-bottom: 0 !important;
  box-shadow: none !important;
  backdrop-filter: none !important;
}

.sticky.top-0.z-20.border-b[class~="bg-card/95"].backdrop-blur > .mx-auto.flex.max-w-6xl.items-center.justify-between,
nav[aria-label="NBA sections"] > div,
.mlb-page nav[aria-label="MLB sections"] > div,
.border-b.bg-card > .mx-auto.flex.max-w-7xl.items-center.justify-between.gap-2.px-4 {
  justify-content: center !important;
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
}

.sticky.top-0.z-20.border-b[class~="bg-card/95"].backdrop-blur > .mx-auto.flex.max-w-6xl.items-center.justify-between > .flex.overflow-x-auto,
nav[aria-label="NBA sections"] > div > .flex.overflow-x-auto,
.mlb-page nav[aria-label="MLB sections"] > div > .flex.overflow-x-auto,
.border-b.bg-card > .mx-auto.flex.max-w-7xl.items-center.justify-between.gap-2.px-4 > .flex.overflow-x-auto {
  margin-left: auto !important;
  margin-right: auto !important;
  justify-content: center !important;
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  backdrop-filter: none !important;
}

/* WNBA: Opening Tips / First Baskets / Strongest Play centered as one group. */
.sticky.top-0.z-20.border-b[class~="bg-card/95"].backdrop-blur > .mx-auto.flex.max-w-6xl.items-center.justify-between > .flex.overflow-x-auto {
  margin-inline: auto !important;
  justify-self: center !important;
}

@media (max-width: 640px) {
  .sticky.top-0.z-20.border-b[class~="bg-card/95"].backdrop-blur > .mx-auto.flex.max-w-6xl.items-center.justify-between > .flex.overflow-x-auto,
  nav[aria-label="NBA sections"] > div > .flex.overflow-x-auto,
  .mlb-page nav[aria-label="MLB sections"] > div > .flex.overflow-x-auto,
  .border-b.bg-card > .mx-auto.flex.max-w-7xl.items-center.justify-between.gap-2.px-4 > .flex.overflow-x-auto {
    padding: 2px 0 !important;
  }

  /* Remove reserved right-side space that was pulling WNBA/NFL rows left. */
  .sticky.top-0.z-20.border-b[class~="bg-card/95"].backdrop-blur > .mx-auto.flex.max-w-6xl.items-center.justify-between > .flex.overflow-x-auto {
    width: 100% !important;
  }
}
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/mobile-category-tabs.css
          git diff --cached --quiet || git commit -m "Float and center category tabs on all screens"
          git push
