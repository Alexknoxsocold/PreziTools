name: Float category tabs
on:
  push:
    paths:
      - '.github/workflows/float-category-tabs.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Restore WNBA model and expose verified scorer
        shell: bash
        run: |
          git show 6280f33b94a9b8f434aedd4640e42d842ed049d0:server/wnbaFirstBasket.ts > server/wnbaFirstBasket.ts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server/wnbaFirstBasket.ts')
          s=p.read_text()
          s=s.replace('  tipSignal: WnbaTipSignal;\n};', '  tipSignal: WnbaTipSignal;\n  verifiedFirstScorer: string | null;\n  verifiedFirstScorerTeam: string | null;\n};')
          anchor='    games.push({\n      id: String(event.id),'
          insert='''    let verifiedFirstScorer: string | null = null, verifiedFirstScorerTeam: string | null = null;\n    if (pool && event?.status?.type?.completed === true) {\n      const graded = await pool.query(\n        "SELECT first_scorer,first_scorer_team FROM wnba_processed_games WHERE espn_game_id=$1 LIMIT 1",\n        [String(event.id)],\n      );\n      verifiedFirstScorer = graded.rows[0]?.first_scorer ? String(graded.rows[0].first_scorer) : null;\n      verifiedFirstScorerTeam = graded.rows[0]?.first_scorer_team ? String(graded.rows[0].first_scorer_team) : null;\n    }\n    games.push({\n      id: String(event.id),'''
          if anchor not in s: raise SystemExit('games anchor missing')
          s=s.replace(anchor,insert,1)
          anchor2='''      tipSignal: await tipSignal(\n        awayTeam,\n        homeTeam,\n        lineupStatus === "waiting" ? [] : candidates,\n      ),\n    });'''
          repl2='''      tipSignal: await tipSignal(\n        awayTeam,\n        homeTeam,\n        lineupStatus === "waiting" ? [] : candidates,\n      ),\n      verifiedFirstScorer,\n      verifiedFirstScorerTeam,\n    });'''
          if anchor2 not in s: raise SystemExit('tip anchor missing')
          s=s.replace(anchor2,repl2,1)
          p.write_text(s)
          PY
      - name: Commit recovery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/wnbaFirstBasket.ts
          git diff --cached --quiet || git commit -m "Restore WNBA model and expose verified first scorer"
          git push
